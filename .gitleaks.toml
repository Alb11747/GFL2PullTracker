title = "GFL2 tracker secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public localStorage preference name, not an API credential"
condition = "AND"
paths = ['''(^|/)web/src/lib/reward-history\.ts$''']
regexTarget = "secret"
regexes = ['''^gfl2\.reward-rarities$''']

[[rules.allowlists]]
description = "Public localStorage diagnostics preference name, not an API credential"
condition = "AND"
paths = ['''(^|/)web/src/lib/telemetry/local-diagnostics\.ts$''']
regexTarget = "secret"
regexes = ['''^gfl2\.diagnostics\.muted$''']
